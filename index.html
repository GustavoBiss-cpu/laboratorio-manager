<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratórios, sem briga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<span class="blob b1" aria-hidden="true"></span>
<span class="blob b2" aria-hidden="true"></span>

<header class="hero">
  <h1>Sistema de agendamento de<br>laboratório</h1>
  <p>Diga o que a sua turma precisa. Marque seu horário.</p>
</header>

<main>
  <section class="pedido" aria-labelledby="t-pedido">
    <h2 id="t-pedido">O que a sua aula precisa?</h2>
    <form id="form">
      <div class="linha">
        <label>Professor(a)<input name="professor" required autocomplete="off" placeholder="Seu nome"></label>
      </div>
      <div class="linha">
        <label class="combo">Turma
          <input name="turma" required autocomplete="off" role="combobox" aria-expanded="false" aria-controls="opcoes" placeholder="Comece a digitar o curso">
          <ul id="opcoes" role="listbox" hidden></ul>
        </label>
        <label>Alunos<input name="alunos" type="number" min="1" max="36" required value="25"></label>
      </div>
      <div class="linha">
        <label>Dia<input name="data" type="date" required></label>
        <label>Começa<input name="ini" type="time" required value="08:00"></label>
        <label>Termina<input name="fim" type="time" required value="10:00"></label>
      </div>
      <div class="tipo" role="radiogroup" aria-label="Tipo de reserva">
        <label><input type="radio" name="tipo" value="avulsa" checked><span>Só neste dia</span></label>
        <label><input type="radio" name="tipo" value="planejada"><span>Toda semana</span></label>
        <label id="semanas" hidden>por <select name="semanas"><option>4</option><option>10</option><option>20</option></select> semanas</label>
      </div>
      <fieldset>
        <legend>Ferramentas necessárias</legend>
        <div id="ferramentas" class="chips"></div>
      </fieldset>
      <button class="botao" type="submit">Encontrar laboratórios</button>
    </form>
  </section>

  <section class="resultado" id="resultado" aria-live="polite"></section>

  <section class="solicitacoes">
    <h2>Solicitações</h2>
    <div id="lista"></div>
    <label class="secretaria"><input type="checkbox" id="modoSec"> Ver como secretaria</label>
  </section>
</main>

<div id="toast" role="status"></div>

<script src="js/data/laboratories.js"></script>
<script src="js/services/laboratoryMatcher.js"></script>
<script src="js/components/laboratoryCard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
